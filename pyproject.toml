[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "froghacker-defense"
version = "0.1.0"
description = "蛙客 AI 防御端开源版 — 统一检测引擎 / 蜜罐 / IDS / 防火墙 / 加固 / 巡逻"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
authors = [{ name = "FrogHacker (wwyhji)" }]
keywords = ["security", "blue-team", "detection", "honeypot", "ids", "defense"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = []  # 纯标准库，零第三方依赖

[project.urls]
Homepage = "https://github.com/wwyhji/froghacker-defense"

[tool.setuptools.packages.find]
include = ["tools*"]

[tool.setuptools.package-data]
"tools.blueteam" = ["*.xml"]
